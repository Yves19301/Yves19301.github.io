<!DOCTYPE html>
<html>
<head>
  <title>Socker App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#050816;color:white;}

    .topbar{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#0b1020;}

    .title{font-size:24px;font-weight:bold;}

    .page{display:none;padding:15px;}
    .activePage{display:block;}

    .tabs{
      position:fixed;bottom:0;width:100%;
      display:flex;justify-content:space-around;
      background:#0b1020;padding:10px;
    }

    .tab{color:#aaa;cursor:pointer;}
    .activeTab{color:#18d26e;font-weight:bold;}

    .btn{
      margin:10px 15px;
      padding:12px;
      background:#18d26e;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .card{
      background:#11192d;
      margin:10px;
      padding:15px;
      border-radius:12px;
    }
  </style>
</head>

<body>

<!-- HOME -->
<div id="homePage" class="page activePage">

  <div class="topbar">
    <div class="title">SOCKER ⚽</div>
  </div>

  <button class="btn" onclick="payPi()">💰 Pay with Pi</button>

  <div class="card">
    Manchester City vs Liverpool
  </div>

</div>

<!-- DETAILS -->
<div id="detailsPage" class="page">
  <h2>Details Page</h2>
</div>

<!-- STORE -->
<div id="storePage" class="page">
  <h2>Store</h2>
</div>

<!-- PROFILE -->
<div id="profilePage" class="page">
  <h2>Profile</h2>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab activeTab" onclick="openTab(this,'homePage')">HOME</div>
  <div class="tab" onclick="openTab(this,'detailsPage')">DETAILS</div>
  <div class="tab" onclick="openTab(this,'storePage')">STORE</div>
  <div class="tab" onclick="openTab(this,'profilePage')">PROFILE</div>
</div>

<script>
Pi.init({ version:"2.0", sandbox:true });

let currentUser = null;
let paymentRunning = false;

// LOGIN auto
async function login(){
  try{
    const auth = await Pi.authenticate(["username","payments"]);
    currentUser = auth.user;
  }catch(e){}
}
login();

async function payPi(){

  if(!currentUser){
    alert("Login with Pi first");
    return;
  }

  if(paymentRunning) return;

  paymentRunning = true;

  try{

    await Pi.createPayment(
      {
        amount:1,
        memo:"Socker Payment",
        metadata:{app:"socker"}
      },
      {
        onReadyForServerApproval:function(paymentId){
          fetch("https://pi-server-3pra.onrender.com/approve-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({paymentId})
          });
        },

        onReadyForServerCompletion:function(paymentId,txid){
          fetch("https://pi-server-3pra.onrender.com/complete-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({paymentId,txid})
          })
          .then(()=>alert("Payment Success ✅"))
          .finally(()=>paymentRunning=false);
        },

        onCancel:function(){
          paymentRunning=false;
        },

        onError:function(){
          paymentRunning=false;
        }
      }
    );

  }catch(e){
    paymentRunning=false;
  }
}

function openTab(el,page){

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("activePage"));
  document.getElementById(page).classList.add("activePage");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("activeTab"));
  el.classList.add("activeTab");
}
</script>

</body>
</html>
