<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socker App UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 15px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    .tabs {
      display: flex;
      background: #1f2937;
      overflow-x: auto;
    }

    .tab {
      padding: 12px 18px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: #2563eb;
    }

    .content {
      padding: 20px;
      display: none;
    }

    .content.active {
      display: block;
    }

    .card {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #a3a3a3;
    }
  </style>
</head>

<body>

<header>
  <button class="btn" onclick="goBack()">⬅ Back</button>
  <h3>Socker App</h3>
  <button class="btn" onclick="login()">Login</button>
</header>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="openTab('home')">Home</div>
  <div class="tab" onclick="openTab('matches')">Matches</div>
  <div class="tab" onclick="openTab('premium')">Premium</div>
</div>

<!-- CONTENT -->
<div id="home" class="content active">
  <div class="card">
    <h3>Welcome</h3>
    <p>This is Home tab content.</p>
  </div>
</div>

<div id="matches" class="content">
  <div class="card">
    <h3>Live Matches</h3>
    <p>No matches yet.</p>
  </div>
</div>

<div id="premium" class="content">
  <div class="card">
    <h3>Premium Access</h3>
    <p>Unlock with Pi Payment</p>

    <button class="btn" onclick="pay()">Pay with Pi</button>

    <p id="status"></p>
  </div>
</div>

<script src="payment.js"></script>

<script>
  // ======================
  // TAB SYSTEM
  // ======================
  function openTab(tabId) {
    let tabs = document.querySelectorAll(".tab");
    let contents = document.querySelectorAll(".content");

    tabs.forEach(t => t.classList.remove("active"));
    contents.forEach(c => c.classList.remove("active"));

    event.target.classList.add("active");
    document.getElementById(tabId).classList.add("active");
  }

  // ======================
  // BACK BUTTON
  // ======================
  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      alert("No page to go back to");
    }
  }
</script>

</body>
</html>
