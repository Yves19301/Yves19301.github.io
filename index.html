<!DOCTYPE html>
<html>
<head>
  <title>Socker App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#050816;font-family:Arial;color:white;padding-bottom:90px;}

    .topbar{display:flex;justify-content:space-between;align-items:center;padding:18px;background:#0b1020;border-bottom:1px solid #1b2238;}

    .logo{display:flex;align-items:center;gap:10px;}

    .shield{width:42px;height:42px;border-radius:14px;background:#18d26e;display:flex;justify-content:center;align-items:center;font-size:20px;color:black;font-weight:bold;}

    .title{font-size:28px;font-weight:bold;}

    .notification{width:44px;height:44px;border-radius:50%;background:#11192d;display:flex;justify-content:center;align-items:center;position:relative;cursor:pointer;font-size:20px;}

    .dot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:#18d26e;}

    .leagues{display:flex;overflow-x:auto;gap:12px;padding:18px;scrollbar-width:none;}
    .leagues::-webkit-scrollbar{display:none;}

    .league{min-width:150px;background:#141c31;color:white;padding:14px;border-radius:18px;text-align:center;cursor:pointer;font-weight:bold;}
    .activeLeague{background:#18d26e;color:black;}

    .live-header{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin-bottom:15px;}
    .live-title{font-size:24px;font-weight:bold;}
    .live-badge{background:#ff3b5c;padding:10px 15px;border-radius:20px;font-weight:bold;}

    .match-card{background:#11192d;margin:18px;border-radius:24px;padding:22px;border:1px solid #1f2942;}

    .league-name{color:#9aa3bb;margin-bottom:12px;}

    .minute{text-align:right;color:#ff4a6a;font-weight:bold;margin-bottom:10px;}

    .match-row{display:flex;justify-content:space-between;align-items:center;}

    .team{width:35%;font-size:18px;font-weight:bold;}

    .score{width:20%;text-align:center;font-size:40px;font-weight:bold;}

    .stadium{margin-top:18px;padding-top:14px;border-top:1px solid #1d2640;display:flex;justify-content:space-between;color:#8d96ad;}

    .details{color:#18d26e;font-weight:bold;cursor:pointer;}

    .page{display:none;padding:20px;}
    .activePage{display:block;}

    .tabs{position:fixed;bottom:0;width:100%;background:#0b1020;display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #1d2640;}

    .tab{text-align:center;color:#9aa3bb;font-size:13px;cursor:pointer;}

    .activeTab{color:#18d26e;font-weight:bold;}

    .backBtn{background:#18d26e;color:black;border:none;padding:10px 16px;border-radius:12px;margin-bottom:20px;font-weight:bold;cursor:pointer;}
  </style>
</head>

<body>

<!-- HOME -->
<div id="homePage" class="activePage">

  <div class="topbar">
    <div class="logo">
      <div class="shield">⚽</div>
      <div class="title">SOCKER</div>
    </div>

    <div class="notification" onclick="alert('Notifications')">
      🔔
      <div class="dot"></div>
    </div>
  </div>

  <!-- 💰 PAY BUTTON -->
  <button onclick="payPi()" style="
    margin:18px;
    padding:12px 20px;
    background:#18d26e;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
  ">
    💰 Pay with Pi
  </button>

  <div class="leagues">
    <div class="league activeLeague" onclick="selectLeague(this,'Premier League')">Premier League</div>
    <div class="league" onclick="selectLeague(this,'LaLiga')">LaLiga</div>
    <div class="league" onclick="selectLeague(this,'Bundesliga')">Bundesliga</div>
  </div>

  <div class="live-header">
    <div class="live-title">🔴 LIVE NOW</div>
    <div class="live-badge">3 LIVE</div>
  </div>

  <div class="match-card">
    <div class="league-name">Premier League</div>
    <div class="minute">78'</div>

    <div class="match-row">
      <div class="team">Manchester City</div>
      <div class="score">2 : 1</div>
      <div class="team" style="text-align:right;">Liverpool</div>
    </div>

    <div class="stadium">
      <div>📍 Etihad Stadium</div>
      <div class="details" onclick="openDetails('Man City vs Liverpool','2 : 1','Etihad Stadium','78')">Details ></div>
    </div>
  </div>

</div>

<!-- DETAILS -->
<div id="detailsPage" class="page">
  <button class="backBtn" onclick="goHome()">⬅ Back</button>

  <h1 id="detailsTitle"></h1>
  <h2 id="detailsScore"></h2>
  <p id="detailsMinute"></p>
  <p id="detailsStadium"></p>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab activeTab" onclick="openTab(this,'homePage')">🏠 HOME</div>
  <div class="tab" onclick="openTab(this,'detailsPage')">📄 DETAILS</div>
</div>

<script>
try {
  Pi.init({ version: "2.0", sandbox: true });
} catch(e) {}

let currentUser = null;
let paymentRunning = false;

async function login(){
  try {
    const auth = await Pi.authenticate(["username","payments"]);
    currentUser = auth.user;
    alert("Login success " + currentUser.username);
  } catch(e){
    alert("Login failed");
  }
}

async function payPi(){

  if(!currentUser){
    alert("Login first");
    return;
  }

  if(paymentRunning) return;

  paymentRunning = true;

  try {

    await Pi.createPayment(
      {
        amount: 1,
        memo: "Socker Payment",
        metadata: { app: "socker" }
      },
      {
        onReadyForServerApproval: function(paymentId){
          fetch("https://pi-server-3pra.onrender.com/approve-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({paymentId})
          });
        },

        onReadyForServerCompletion: function(paymentId, txid){
          fetch("https://pi-server-3pra.onrender.com/complete-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({paymentId,txid})
          })
          .then(()=>alert("Payment Success ✅"))
          .finally(()=>paymentRunning=false);
        },

        onCancel:function(){
          paymentRunning=false;
          alert("Cancelled");
        },

        onError:function(){
          paymentRunning=false;
          alert("Error");
        }
      }
    );

  } catch(e){
    paymentRunning=false;
    alert("Failed");
  }
}

function selectLeague(el,name){
  document.querySelectorAll(".league").forEach(x=>x.classList.remove("activeLeague"));
  el.classList.add("activeLeague");
}

function openDetails(t,s,st,m){
  document.getElementById("homePage").classList.remove("activePage");
  document.getElementById("detailsPage").classList.add("activePage");

  document.getElementById("detailsTitle").innerText=t;
  document.getElementById("detailsScore").innerText=s;
  document.getElementById("detailsMinute").innerText="Minute: "+m;
  document.getElementById("detailsStadium").innerText=st;
}

function goHome(){
  document.getElementById("detailsPage").classList.remove("activePage");
  document.getElementById("homePage").classList.add("activePage");
}

function openTab(el,page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("activePage"));
  document.getElementById(page).classList.add("activePage");
}
</script>

</body>
</html>
