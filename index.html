<!DOCTYPE html>
<html>
<head>
  <title>Socker App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#050816;font-family:Arial;color:white;padding-bottom:80px;}

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:#0b1020;
      border-bottom:1px solid #1b2238;
    }

    .title{font-size:24px;font-weight:bold;}

    .page{display:none;padding:15px;}
    .activePage{display:block;}

    .tabs{
      position:fixed;
      bottom:0;
      width:100%;
      display:flex;
      justify-content:space-around;
      background:#0b1020;
      padding:12px 0;
      border-top:1px solid #1b2238;
    }

    .tab{
      color:#9aa3bb;
      font-size:13px;
      text-align:center;
      cursor:pointer;
    }

    .activeTab{
      color:#18d26e;
      font-weight:bold;
    }

    .card{
      background:#11192d;
      padding:15px;
      margin:10px 0;
      border-radius:12px;
    }

    .btn{
      padding:10px 15px;
      background:#18d26e;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }
  </style>
</head>

<body>

<!-- HOME -->
<div id="homePage" class="page activePage">

  <div class="topbar">
    <div class="title">SOCKER ⚽</div>
  </div>

  <div class="card">
    🔴 Live Match
    <br><br>
    Manchester City vs Liverpool
  </div>

  <div class="card">
    📊 Premier League Updates
  </div>

</div>

<!-- FIXTURES -->
<div id="fixturesPage" class="page">
  <div class="topbar"><div class="title">Fixtures</div></div>
  <div class="card">No fixtures yet</div>
</div>

<!-- CLUB -->
<div id="clubPage" class="page">
  <div class="topbar"><div class="title">Club</div></div>
  <div class="card">Club info coming soon</div>
</div>

<!-- STORE -->
<div id="storePage" class="page">
  <div class="topbar"><div class="title">Store</div></div>
  <div class="card">Store items coming soon</div>
</div>

<!-- PROFILE -->
<div id="profilePage" class="page">
  <div class="topbar"><div class="title">Profile</div></div>
  <div class="card">User profile</div>
</div>

<!-- TABS -->
<div class="tabs">

  <div class="tab activeTab" onclick="openTab(this,'homePage')">
    HOME
  </div>

  <div class="tab" onclick="openTab(this,'fixturesPage')">
    FIXTURES
  </div>

  <div class="tab" onclick="openTab(this,'clubPage')">
    CLUB
  </div>

  <div class="tab" onclick="openTab(this,'storePage')">
    STORE
  </div>

  <div class="tab" onclick="openTab(this,'profilePage')">
    PROFILE
  </div>

</div>

<script>
function openTab(el,page){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("activePage");
  });

  document.getElementById(page).classList.add("activePage");

  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.remove("activeTab");
  });

  el.classList.add("activeTab");
}
</script>

</body>
</html>
